name: Finalize Phase 1 content
on: [push]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          def r(path, old, new):
              p=Path(path); t=p.read_text(encoding='utf-8')
              if old not in t: raise SystemExit(f'missing: {old[:80]}')
              p.write_text(t.replace(old,new,1),encoding='utf-8')
          r('chapters/ch02/index.html','인스턴스 하나에 최대 5개 적용 가능','기본 quota는 네트워크 인터페이스당 5개이며, Service Quotas에서 조정 시 최대 16개까지 요청 가능')
          r('chapters/ch02/index.html','크레딧이 고갈돼도 성능이 떨어지지 않지만 <strong>초과 크레딧 사용에 추가 요금($0.05/vCPU·시간)</strong>이 붙습니다. CloudWatch에서 <code>CPUCreditBalance</code>를 모니터링하세요. t2는 standard 모드 기본이라 크레딧 고갈 시 기준 성능으로 제한됩니다.','크레딧이 고갈돼도 Unlimited 모드에서는 추가 CPU를 사용할 수 있지만 <strong>잉여 CPU Credit에 추가 요금이 발생할 수 있습니다.</strong> 정확한 금액은 현재 EC2 On-Demand의 T2/T3/T4g Unlimited Mode 가격을 확인하세요. CloudWatch의 <code>CPUCreditBalance</code>와 <code>CPUSurplusCreditsCharged</code>를 함께 모니터링하면 좋습니다. t2는 설정 방식이 다를 수 있으므로 생성·운영 시 Credit specification을 확인합니다.')
          r('chapters/ch05/index.html','<tr><td><strong>Bucket</strong></td><td>객체를 담는 최상위 컨테이너. 일반 목적 버킷 이름은 전역에서 고유해야 함</td><td><code>company-prod-assets</code></td></tr>','<tr><td><strong>Bucket</strong></td><td>객체를 담는 최상위 컨테이너. 일반 목적 버킷은 기본적으로 shared global namespace를 사용하며 이 경우 partition 내에서 이름이 고유해야 합니다. 필요하면 계정·리전 전용 account regional namespace도 선택할 수 있습니다.</td><td><code>company-prod-assets</code></td></tr>')
          p=Path('chapters/ch09/index.html'); t=p.read_text(encoding='utf-8')
          marker='<section class="content-section" id="pipeline">'
          if 'id="beginner-flow"' not in t:
              primer='''<section class="content-section" id="beginner-flow"><div class="section-label">먼저 이해하기</div><h2>CI/CD를 AWS 용어 없이 먼저 보면</h2><p>처음에는 서비스 이름을 외우지 말고 <strong>소스코드 → 검사 → 배포파일 → 서버 반영 → 정상 확인</strong>이라는 다섯 단계만 잡으면 됩니다. AWS 서비스는 이 단계를 자동으로 실행하도록 도와주는 도구입니다.</p><div class="content-table-wrap"><table class="content-table"><thead><tr><th>쉬운 말</th><th>자주 쓰는 말</th><th>뜻</th></tr></thead><tbody><tr><td>소스코드가 바뀜</td><td><strong>Source / Commit</strong></td><td>어떤 코드 버전을 배포할지 정합니다.</td></tr><tr><td>테스트하고 빌드함</td><td><strong>Build / CI</strong></td><td>코드가 깨지지 않았는지 검사하고 실행 가능한 결과물을 만듭니다.</td></tr><tr><td>만들어진 배포파일</td><td><strong>Artifact</strong></td><td>JAR·ZIP처럼 실제 서버에 전달할 결과물입니다.</td></tr><tr><td>배포할 한 버전</td><td><strong>Revision</strong></td><td>어떤 Artifact와 설정을 배포하는지 식별하는 단위입니다.</td></tr><tr><td>배포 중 실행할 단계</td><td><strong>Lifecycle Hook</strong></td><td>서비스 중지, 파일 설치, 재기동, 정상 확인처럼 배포 순서마다 실행하는 작업입니다.</td></tr><tr><td>다음 단계로 넘어가도 되는지 확인</td><td><strong>Gate</strong></td><td>테스트·승인·Health Check가 통과해야 배포를 계속하게 만드는 문입니다.</td></tr></tbody></table></div><div class="callout callout-tip"><span class="callout-icon">💡</span><div class="callout-body"><strong>한 줄로 기억하세요.</strong><br>CodePipeline은 순서를 연결하고, CodeBuild는 검사·빌드하고, CodeDeploy는 서버에 반영합니다. Artifact는 그 과정에서 전달되는 “배포할 물건”입니다.</div></div></section>'''
              if marker not in t: raise SystemExit('pipeline marker missing')
              t=t.replace(marker,primer+marker,1); p.write_text(t,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- chapters/ch02/index.html chapters/ch05/index.html chapters/ch09/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: finalize phase1 beginner and AWS guidance'
          git push origin HEAD:main
