name: Finish AWS Guide Phase 1

on:
  push:
    paths:
      - '.github/workflows/finish-phase1.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add final beginner learning layers
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected marker not found in {path}: {old[:120]}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # CH02 — tell beginners what is essential now vs safe to revisit later.
          ch02_marker = '''        <p>이름의 <strong>Elastic</strong>은 탄력적이라는 뜻입니다. 트래픽이 몰리면 사양을 올리고, 새벽처럼 한산할 때는 낮춥니다. 온프레미스 서버는 최대 트래픽 기준으로 사야 했지만, EC2는 지금 필요한 만큼만 씁니다.</p>'''
          ch02_add = ch02_marker + '''

        <div class="callout callout-tip beginner-priority">
          <span class="callout-icon">🧭</span>
          <div class="callout-body">
            <strong>처음 학습할 때는 전부 외우지 않아도 됩니다.</strong><br>
            <strong>지금 꼭 이해할 것:</strong> EC2가 가상 서버라는 점, 인스턴스 유형, 보안 그룹, EBS, 키 페어, Stop과 Terminate 차이, 실습 후 비용 정리.<br>
            <strong>첫 실습 후 다시 볼 심화:</strong> CPU Credit, ENI, User Data, Instance Metadata, Session Manager, 세부 요금 모델. 먼저 서버를 한 번 만들어 본 뒤 돌아오면 훨씬 쉽게 이해됩니다.
          </div>
        </div>'''
          replace_once('chapters/ch02/index.html', ch02_marker, ch02_add)

          # CH03 — concrete /16 -> /24 CIDR mental model.
          ch03_marker = '''        <p>VPC를 만들 때 <code>10.0.0.0/16</code>처럼 CIDR 표기법으로 IP 주소 범위를 정합니다. 뒤의 숫자가 작을수록 네트워크 범위가 커집니다.</p>'''
          ch03_add = ch03_marker + '''

        <div class="callout callout-tip beginner-cidr">
          <span class="callout-icon">🧮</span>
          <div class="callout-body">
            <strong>/16과 /24를 처음에는 이렇게만 기억하세요.</strong><br>
            <code>10.0.0.0/16</code>은 큰 아파트 단지처럼 약 65,536개의 IPv4 주소 범위를 담습니다. 이 큰 범위를 <code>10.0.1.0/24</code>, <code>10.0.2.0/24</code>처럼 나누면 각 /24는 256개 주소를 가진 작은 동 하나가 됩니다.<br>
            즉 <strong>VPC /16 = 큰 전체 부지</strong>, <strong>Subnet /24 = 그 안에 나눈 구역</strong>이라고 먼저 이해하면 됩니다. AWS IPv4 서브넷에서는 예약 주소 때문에 /24의 실제 사용 가능 주소는 251개입니다.
          </div>
        </div>'''
          replace_once('chapters/ch03/index.html', ch03_marker, ch03_add)

          # CH05 — warehouse analogy before formal terms.
          ch05_marker = '''        <h3>S3 기본 구조</h3>'''
          ch05_add = '''        <div class="callout callout-tip beginner-s3">
          <span class="callout-icon">📦</span>
          <div class="callout-body">
            <strong>S3를 창고라고 생각하면 쉽습니다.</strong><br>
            <strong>Bucket = 창고</strong>, <strong>Object = 창고에 넣은 물건</strong>, <strong>Key = 물건을 찾는 전체 이름표</strong>, <strong>Prefix = 이름표 앞부분을 묶어 폴더처럼 보이게 하는 분류</strong>입니다.<br>
            예를 들어 <code>uploads/2026/photo.jpg</code>라는 Key라면 실제 물건은 <code>photo.jpg</code> 객체이고, <code>uploads/2026/</code> 부분을 Prefix로 묶어 볼 수 있습니다.
          </div>
        </div>

''' + ch05_marker
          replace_once('chapters/ch05/index.html', ch05_marker, ch05_add)

          # CH08 — numeric alarm example before terminology table.
          ch08_marker = '''<section class="content-section" id="alarms"><div class="section-label">05</div><h2>Alarms — 임계값보다 중요한 것은 평가 방식</h2><p>CloudWatch Alarm은 단순히 “CPU가 70%를 넘으면 알림”만 설정하는 기능이 아닙니다. Period, Evaluation Periods, Datapoints to Alarm, Missing Data 처리 방식을 함께 정해야 실제 운영 의도와 맞게 동작합니다.</p>'''
          ch08_add = ch08_marker + '''<div class="callout callout-tip beginner-alarm"><span class="callout-icon">🔢</span><div class="callout-body"><strong>숫자로 먼저 보면 쉽습니다.</strong><br>예를 들어 <strong>Period 1분, Evaluation Periods 5, Datapoints to Alarm 3, Threshold CPU 70%</strong>라면 “최근 5개의 1분 데이터 중 3개 이상이 CPU 70%를 넘으면 ALARM”이라고 이해하면 됩니다.<br>즉 <strong>Period = 한 칸의 길이</strong>, <strong>Evaluation Periods = 몇 칸을 볼지</strong>, <strong>Datapoints to Alarm = 그중 몇 칸이 나빠야 경보인지</strong>입니다.</div></div>'''
          replace_once('chapters/ch08/index.html', ch08_marker, ch08_add)

          # self-remove
          Path('.github/workflows/finish-phase1.yml').unlink()

      - name: Verify final markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q '처음 학습할 때는 전부 외우지 않아도 됩니다' chapters/ch02/index.html
          grep -q 'VPC /16 = 큰 전체 부지' chapters/ch03/index.html
          grep -q 'Bucket = 창고' chapters/ch05/index.html
          grep -q '최근 5개의 1분 데이터 중 3개 이상' chapters/ch08/index.html
          ! test -e .github/workflows/finish-phase1.yml

      - name: Commit final Phase 1 content
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- chapters/ch02/index.html chapters/ch03/index.html chapters/ch05/index.html chapters/ch08/index.html .github/workflows/finish-phase1.yml
          git commit -m 'feat: complete phase1 beginner learning layers'
          git push origin HEAD:main
